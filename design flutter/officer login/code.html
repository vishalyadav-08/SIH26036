<style>
        .m3-input {
            transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
        }
        .m3-input:focus-within label {
            transform: translateY(-50%) scale(0.75);
            color: #000666; /* primary color */
        }
        .m3-input:focus-within input {
            padding-top: 24px;
            padding-bottom: 8px;
        }
        .m3-input input:not(:placeholder-shown) + label {
            transform: translateY(-50%) scale(0.75);
        }
        .m3-input input:not(:placeholder-shown) {
            padding-top: 24px;
            padding-bottom: 8px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="h-full flex items-center justify-center p-standard bg-surface-container-low dark:bg-surface-container-low">
<div class="w-full max-w-md bg-surface-container-lowest rounded-3xl p-section shadow-sm border border-outline-variant/30 flex flex-col gap-major">
<!-- Branding Section -->
<div class="flex flex-col items-center text-center gap-compact">
<div class="w-20 h-20 rounded-full bg-primary-container flex items-center justify-center mb-gap shadow-inner">
<span class="material-symbols-outlined text-[40px] text-on-primary-container" style="font-variation-settings: 'FILL' 1;">
                    shield_person
                </span>
</div>
<div>
<h1 class="font-display-sm text-display-sm font-bold text-primary dark:text-primary-fixed-dim">
                    MapanSetu
                </h1>
<p class="font-title-lg text-title-lg text-secondary">
                    Field Officer Portal
                </p>
</div>
<div class="mt-micro bg-secondary-container px-3 py-1 rounded-full">
<span class="font-label-sm text-label-sm text-on-secondary-container uppercase tracking-wider">
                    SIH 2026 Prototype
                </span>
</div>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-standard w-full">
<!-- Officer ID Field -->
<div class="relative m3-input bg-surface-container-highest rounded-t-lg border-b-2 border-outline-variant hover:border-outline focus-within:border-primary transition-colors">
<input class="block w-full px-standard pt-standard pb-standard bg-transparent border-none text-on-surface font-body-lg focus:ring-0 focus:outline-none z-10 relative" id="officerId" placeholder=" " required="" type="text"/>
<label class="absolute left-standard top-1/2 -translate-y-1/2 text-on-surface-variant font-body-lg transition-all origin-top-left pointer-events-none z-0" for="officerId">
                    Officer ID
                </label>
</div>
<!-- Password Field -->
<div class="relative m3-input bg-surface-container-highest rounded-t-lg border-b-2 border-outline-variant hover:border-outline focus-within:border-primary transition-colors mt-compact">
<input class="block w-full px-standard pt-standard pb-standard bg-transparent border-none text-on-surface font-body-lg focus:ring-0 focus:outline-none z-10 relative" id="password" placeholder=" " required="" type="password"/>
<label class="absolute left-standard top-1/2 -translate-y-1/2 text-on-surface-variant font-body-lg transition-all origin-top-left pointer-events-none z-0" for="password">
                    Password
                </label>
<button class="absolute right-standard top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface z-20 focus:outline-none" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
<!-- Forgot Password -->
<div class="flex justify-end w-full mt-micro">
<a class="font-label-lg text-label-lg text-primary hover:text-primary-container transition-colors" href="#">
                    Forgot Password?
                </a>
</div>
<!-- Action Area -->
<div class="flex flex-col gap-standard mt-section">
<button class="w-full h-12 bg-primary hover:bg-primary-container text-on-primary font-label-lg text-label-lg rounded-full flex items-center justify-center gap-compact transition-colors active:scale-[0.98]" type="submit">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">login</span>
                    Sign In
                </button>
</div>
</form>
<!-- Footer / Language Selector -->
<div class="flex justify-center items-center gap-standard pt-section border-t border-outline-variant/30 w-full mt-auto">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">language</span>
<select class="bg-transparent border-none font-label-md text-label-md text-on-surface-variant focus:ring-0 cursor-pointer p-0 pr-6">
<option value="en">English</option>
<option value="hi">हिन्दी</option>
</select>
</div>
</div>
</body></html>
