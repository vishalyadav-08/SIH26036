services:
  # ─── Django Web Service ────────────────────────────────────────────────────
  - type: web
    name: mapansetu-backend
    runtime: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn root.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URI
        fromDatabase:
          name: mapansetu-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://mapansetu-backend.onrender.com,https://mapansetu-frontend.vercel.app"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://mapansetu-frontend.vercel.app"
      - key: FRONTEND_URL
        value: "https://mapansetu-frontend.vercel.app"
      - key: BACKEND_URL
        value: "https://mapansetu-backend.onrender.com"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.console.EmailBackend"

# ─── PostgreSQL Database ────────────────────────────────────────────────────
databases:
  - name: mapansetu-db
    databaseName: mapansetu
    user: mapansetu
    plan: free
