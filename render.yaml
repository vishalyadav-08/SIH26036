services:
  # ─── Django Web Service ────────────────────────────────────────────────────
  - type: web
    name: mapansetu-backend
    runtime: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn root.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true

      # ── Database (Supabase PostgreSQL) ───────────────────────────────────
      # Set this in the Render dashboard → Environment → DATABASE_URI
      # Copy the "URI" connection string from: Supabase → Settings → Database
      - key: DATABASE_URI
        sync: false          # fill manually in Render dashboard

      # ── Hosts & CORS ─────────────────────────────────────────────────────
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://mapansetu-backend.onrender.com,https://mapansetu.vercel.app"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://mapansetu.vercel.app"
      - key: FRONTEND_URL
        value: "https://mapansetu.vercel.app"
      - key: BACKEND_URL
        value: "https://mapansetu-backend.onrender.com"

      # ── Supabase Storage (S3-compatible) ─────────────────────────────────
      # Endpoint: Supabase → Settings → Storage → S3 Connection → Endpoint
      # Format:   https://<PROJECT_REF>.supabase.co/storage/v1/s3
      # Region:   shown on same page (e.g. ap-southeast-1)
      # Keys:     Supabase → Settings → Storage → S3 Access Keys → New access key
      - key: MINIO_ENDPOINT
        sync: false          # https://<PROJECT_REF>.supabase.co/storage/v1/s3
      - key: MINIO_ACCESS_KEY
        sync: false          # Supabase S3 Access Key ID
      - key: MINIO_SECRET_KEY
        sync: false          # Supabase S3 Secret Access Key
      - key: MINIO_BUCKET
        value: "mapansetu"
      - key: MINIO_REGION
        sync: false          # e.g. ap-southeast-1 (shown in Supabase S3 settings)

      # ── Email (Resend SMTP — free tier: 3 000 emails/month) ───────────────
      # Sign up at https://resend.com → API Keys → create key → copy it.
      # Add and verify your sender domain OR use onboarding@resend.dev for testing.
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        value: "smtp.resend.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        value: "resend"
      - key: EMAIL_HOST_PASSWORD
        sync: false          # your Resend API key  (re_xxxxxxxxxxxx)
      - key: DEFAULT_FROM_EMAIL
        value: "no-reply@mapansetu.in"   # change to your verified sender domain
